<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Anadolu Üniversitesi Kütüphane ve Dokümantasyon Merkezi - Katalog tarama, elektronik kaynaklar ve kütüphane hizmetleri">
  <title>Anadolu Üniversitesi Kütüphane</title>
<link rel="alternate" hreflang="tr" href="https://kdm.anadolu.edu.tr/index.html"/>
<link rel="alternate" hreflang="en" href="https://kdm.anadolu.edu.tr/index.html"/>
<link rel="alternate" hreflang="x-default" href="https://kdm.anadolu.edu.tr/index.html"/>
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global/variables.css">
  <link rel="stylesheet" href="assets/css/global/base.css">
  <link rel="stylesheet" href="assets/css/global/components.css">
  <link rel="stylesheet" href="assets/css/components/modal.css">
  <link rel="stylesheet" href="assets/css/components/announcements.css">
  <link rel="stylesheet" href="assets/css/global/header.css">
  <link rel="stylesheet" href="assets/css/global/footer.css">
  <link rel="stylesheet" href="assets/css/global/utilities.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
  <link rel="stylesheet" href="assets/css/pages/arrivals.css">
  <link rel="stylesheet" href="assets/css/global/accessibility.css">
</head>
<body data-page-type="home" data-page-name="home">
  <div id="header-container"></div>
  <main class="container main-container">
    <section class="collections" aria-label="Koleksiyonlar">
      <h2 id="collections-title" class="section-title visually-hidden"></h2>
      <div class="collection-box search-border-blue">
        <div class="collection-cards"></div>
        <div class="mobile-collection-select">
          <div class="custom-select-wrapper">
            <select id="mobile-collection-selector" class="custom-select ps-5" aria-label=""></select>
            <div class="custom-select-icon">
              <span id="mobile-selected-icon" class="icon-placeholder icon-blue">
                <i class="bi bi-search"></i>
              </span>
            </div>
            <div class="custom-select-arrow">
              <i class="bi bi-chevron-down"></i>
            </div>
          </div>
        </div>
        <div class="collection-form-container"></div>
      </div>
    </section>
    <section class="library-quick-services full-width" aria-labelledby="services-title">
      <div class="container">
        <h2 id="services-title" class="section-title visually-hidden"></h2>
        <div class="quick-services-grid"></div>
      </div>
    </section>
    <section class="news-announcements py-5" aria-labelledby="news-announcements-title">
      <div class="container px-0">
        <h2 id="news-announcements-title" class="visually-hidden"></h2>
        <div class="content-grid">
          <article class="slider-container">
            <header class="slider-header">
              <h3 class="section-title" style="margin: 0;"></h3>
              <nav class="slider-controls" aria-label="Slider kontrolleri">
                <button type="button" class="control-btn prev-btn" aria-label="">
                  <i class="bi bi-chevron-left"></i>
                </button>
                <button type="button" class="control-btn next-btn" aria-label="">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </nav>
            </header>
            <div class="slider-items-container"></div>
            <div class="slider-progress-container">
              <div class="slider-progress-bar">
                <div class="slider-progress-fill"></div>
              </div>
              <div class="slider-indicators"></div>
              <a href="guncel-haberler.html" class="view-all-link slider-view-all">
                <span class="view-all-text"></span>
                <i class="bi bi-arrow-right"></i>
              </a>
            </div>
          </article>
          <aside class="announcements-container">
            <header class="announcements-header">
              <h3 class="section-title" style="margin: 0;"></h3>
            </header>
            <div class="announcements-wrapper"></div>
            <nav class="announcements-pagination"></nav>
            <div class="announcements-footer">
              <a href="duyurular.html" class="view-all-link slider-view-all">
                <span class="view-all-text"></span>
                <i class="bi bi-arrow-right"></i>
              </a>
            </div>
          </aside>
        </div>
      </div>
    </section>
    <section class="arrivals full-width" aria-labelledby="arrivals-title">
      <div class="container">
        <h3 id="arrivals-title" class="section-title title-large"></h3>
        <div class="arrivals-container">
          <div class="arrival-items"></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="footer-container" class="footer"></footer>
  <div class="library-modal" id="autoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-container">
      <div class="modal-wrapper">
        <button type="button" class="modal-close" data-close-modal aria-label="">
          <i class="bi bi-x-lg"></i>
        </button>
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle"></h2>
        </div>
        <div class="modal-body">
          <div class="modal-image-wrapper">
            <div class="modal-image-loader">
              <div class="spinner"></div>
            </div>
            <img src="" alt="" id="modalImage" class="modal-image">
          </div>
          <p class="modal-description" id="modalDescription"></p>
        </div>
        <div class="modal-footer">
          <a href="#" class="modal-button" id="modalButton"></a>
          <label class="modal-checkbox">
            <input type="checkbox" id="modalDontShow">
            <span class="modal-dont-show-text"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <div id="copy-notification" class="copy-notification" role="status" aria-live="polite">
    <i class="bi bi-check-circle-fill"></i>
    <span class="copy-notification-text"></span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { LibraryApp } from './assets/js/core/app.js';
    // Uygulamayı başlat
    window.libraryApp = new LibraryApp();
  </script>
</body>
</html>
