<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Component Showcase - Standart Bileşen Kütüphanesi | AU Kütüphane</title>
<link rel="alternate" hreflang="tr" href="https://kdm.anadolu.edu.tr/component-showcase.html"/>
<link rel="alternate" hreflang="en" href="https://kdm.anadolu.edu.tr/component-showcase.html"/>
<link rel="alternate" hreflang="x-default" href="https://kdm.anadolu.edu.tr/component-showcase.html"/>
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global/variables.css">
  <link rel="stylesheet" href="assets/css/global/base.css">
  <link rel="stylesheet" href="assets/css/global/components.css">
  <link rel="stylesheet" href="assets/css/global/header.css">
  <link rel="stylesheet" href="assets/css/global/footer.css">
  <link rel="stylesheet" href="assets/css/global/utilities.css">
  <link rel="stylesheet" href="assets/css/global/inner-pages.css">
  <link rel="stylesheet" href="assets/css/global/components-standard.css">
  <link rel="stylesheet" href="assets/css/global/accessibility.css">
  <style>
    /* Showcase özel stilleri */
    .showcase-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 2rem;
    }
    .showcase-section {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 2rem;
      margin-bottom: 3rem;
      border: 2px dashed var(--border-color);
    }
    .showcase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid var(--primary-color);
    }
    .showcase-header h2 {
      color: var(--primary-color);
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .showcase-badge {
      background: var(--primary-color);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .variant-label {
      background: var(--tertiary-color);
      color: var(--primary-color);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      margin: 1.5rem 0 1rem 0;
      display: inline-block;
      border-left: 4px solid var(--primary-color);
    }
    .json-preview {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      overflow-x: auto;
    }
    .json-preview pre {
      margin: 0;
      white-space: pre-wrap;
    }
    .page-title-section {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      color: white;
      padding: 3rem 0;
      margin-top: var(--header-height);
      text-align: center;
    }
    .page-title-section h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .page-title-section p {
      font-size: 1.2rem;
      opacity: 0.95;
    }
  </style>
</head>
<body data-page-type="inner" data-page-name="component-showcase">
  <div id="header-container"></div>
  <div class="page-title-section">
    <div class="container">
      <h1><i class="fas fa-cubes"></i> Standart Bileşen Kütüphanesi</h1>
      <p>Tüm sayfalarda kullanılacak standart bileşenlerin test ve önizleme sayfası</p>
    </div>
  </div>
  <main class="showcase-container">
    <div id="component-showcase-content">
    </div>
  </main>
  <footer id="footer-container" class="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { LibraryApp } from './assets/js/core/app.js';
    // Uygulamayı başlat
    window.libraryApp = new LibraryApp();
  </script>
  <script type="module">
    import { ComponentRenderer } from './assets/js/components/ComponentRenderer.js';
    // Showcase verilerini yükle
    async function loadShowcaseData() {
      try {
        const response = await fetch('data/pages/component-showcase.json');
        const data = await response.json();
        const container = document.getElementById('component-showcase-content');
        let html = '';
        // Her bölümü render et
        data.sections.forEach(section => {
          html += renderSection(section);
        });
        container.innerHTML = html;
      } catch (error) {
        console.error('Showcase verileri yüklenirken hata:', error);
        document.getElementById('component-showcase-content').innerHTML = `
          <div class="alert alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            Veri yüklenirken hata oluştu: ${error.message}
          </div>
        `;
      }
    }
    function renderSection(section) {
      let html = `
        <div class="showcase-section" id="${section.id}">
          <div class="showcase-header">
            <h2>
              <i class="${section.icon}"></i>
              ${section.title}
            </h2>
            <span class="showcase-badge">${section.componentCount} Varyant</span>
          </div>
          <p style="color: var(--text-muted); margin-bottom: 2rem;">${section.description}</p>
      `;
      // Her varyantı render et
      section.variants.forEach(variant => {
        html += `
          <div class="variant-label">
            <i class="fas fa-tag"></i> ${variant.label}
          </div>
        `;
        // Bileşeni render et
        html += ComponentRenderer.render(variant.component);
        // JSON önizleme (isteğe bağlı)
        if (section.showJson) {
          html += `
            <div class="json-preview">
              <strong>JSON Yapısı:</strong>
              <pre>${JSON.stringify(variant.component, null, 2)}</pre>
            </div>
          `;
        }
      });
      html += `</div>`;
      return html;
    }
    // Sayfa yüklendiğinde çalıştır
    document.addEventListener('DOMContentLoaded', loadShowcaseData);
  </script>
</body>
</html>
