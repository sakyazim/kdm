<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Önizleme Yok</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #333;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: #fff; border: 1px solid #ddd; border-radius: 10px;
         padding: 32px 40px; text-align: center; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .icon { font-size: 40px; }
  h2 { margin: 12px 0 8px; font-size: 18px; }
  p { margin: 0; font-size: 14px; color: #666; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🖼️</div>
    <h2>Bu dosya için önizleme yok</h2>
    <p>Seçilen JSON dosyası doğrudan bir site sayfasına bağlı değil
       (ör. ortak veri dosyası veya eski/yedek içerik).
       İçeriği yine de düzenleyebilir ve kaydedebilirsiniz.</p>
  </div>
</body>
</html>
